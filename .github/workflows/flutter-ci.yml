name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false

  build-windows-x64-test:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/windows-x64-test.yml
